<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayTrack — Product Requirements Document [ENCRYPTED]</title>
<style>
/* ─── Lock Screen ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
#lock-screen {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: #0f172a;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#lock-screen.unlocked { opacity: 0; visibility: hidden; pointer-events: none; }
.lock-card {
  background: #1e293b; border-radius: 16px; padding: 2.5rem 2rem; width: 380px; max-width: 90vw;
  box-shadow: 0 25px 60px rgba(0,0,0,0.5); text-align: center;
}
.lock-icon { width: 64px; height: 64px; margin: 0 auto 1rem; background: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
.lock-card h1 { color: #f1f5f9; font-size: 1.3rem; font-weight: 600; margin-bottom: 0.3rem; }
.lock-card p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; }
.lock-card .badge-doc { display: inline-block; background: #10b981; color: #fff; font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
.lock-input { width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 1rem; text-align: center; letter-spacing: 0.15em; outline: none; transition: border-color 0.2s; }
.lock-input:focus { border-color: #10b981; }
.lock-input::placeholder { letter-spacing: 0; color: #475569; font-size: 0.85rem; }
.lock-btn { width: 100%; margin-top: 0.75rem; padding: 0.75rem; border: none; border-radius: 8px; background: #10b981; color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.lock-btn:hover { background: #059669; }
.lock-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.lock-error { color: #f87171; font-size: 0.8rem; margin-top: 0.75rem; display: none; }
.lock-error.show { display: block; }
.lock-footer { color: #475569; font-size: 0.7rem; margin-top: 1rem; }
.spinner { display: none; width: 20px; height: 20px; margin: 0 auto; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
.spinner.show { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
#app { display: none; }
#app.show { display: block; }

/* ─── Document Styles ─── */
:root {
    --primary: #047857;
    --primary-light: #e8f0fe;
    --accent: #f59e0b;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 15px;
  }
  nav.toc {
    position: fixed; top: 0; left: 0; width: 270px; height: 100vh;
    background: var(--card); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 1.5rem 1.25rem; z-index: 100;
  }
  nav.toc h1 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--primary); }
  nav.toc .badge { display: inline-block; background: var(--accent); color: #fff; font-size: 0.6rem; padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.25rem; vertical-align: middle; }
  nav.toc a {
    display: block; padding: 0.3rem 0; color: var(--text-muted);
    text-decoration: none; font-size: 0.82rem; transition: color 0.15s;
  }
  nav.toc a:hover { color: var(--primary); }
  nav.toc a.section { font-weight: 600; color: var(--text); margin-top: 0.4rem; }
  nav.toc a.sub { padding-left: 1rem; font-size: 0.78rem; }
  main { margin-left: 270px; max-width: 920px; padding: 2.5rem 3rem 5rem; }
  h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  h1 { font-size: 2rem; margin: 0 0 0.25rem; }
  h1 + p.meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
  h2 { font-size: 1.35rem; margin: 2.5rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--primary); color: var(--primary); }
  h3 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
  h4 { font-size: 1rem; margin: 1rem 0 0.25rem; }
  p { margin: 0.5rem 0 1rem; }
  ul, ol { margin: 0.5rem 0 1rem 1.5rem; }
  li { margin-bottom: 0.25rem; }
  strong { font-weight: 600; }
  .callout { padding: 1rem 1.25rem; border-radius: 8px; margin: 1rem 0; border-left: 4px solid var(--primary); background: var(--primary-light); }
  .callout.warn { border-color: var(--accent); background: #fef3c7; }
  .callout p { margin: 0; }
  .table-wrap { overflow-x: auto; margin: 1rem 0; border-radius: 8px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 550px; }
  thead { background: var(--primary); color: #fff; }
  th, td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: #f1f5f9; }
  td:first-child { font-weight: 500; white-space: nowrap; font-family: var(--mono); font-size: 0.8rem; }
  td.priority { white-space: nowrap; }
  .badge { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; }
  .badge.mvp { background: #dcfce7; color: #166534; }
  .badge.v2  { background: #dbeafe; color: #065f46; }
  .badge.core { background: #fef3c7; color: #92400e; }
  pre.diagram { background: #0f172a; color: #f8fafc; padding: 1.25rem; border-radius: 10px; overflow-x: auto; font-family: var(--mono); font-size: 0.75rem; line-height: 1.5; }
  code { background: #f1f5f9; color: #1e293b; padding: 0.1rem 0.3rem; border-radius: 4px; font-family: var(--mono); font-size: 0.8rem; }
  pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 8px; overflow-x: auto; font-family: var(--mono); font-size: 0.8rem; line-height: 1.5; }
  .lock-card p { color: #cbd5e1; }
  .flow-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin: 0.75rem 0; counter-reset: step; }
  .flow-box ol { list-style: none; counter-reset: step; margin: 0; }
  .flow-box ol li { counter-increment: step; margin-bottom: 0.6rem; position: relative; padding-left: 2rem; }
  .flow-box ol li::before { content: counter(step); position: absolute; left: 0; top: 0; background: var(--primary); color: #fff; font-size: 0.7rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .edge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 0.75rem 0; }
  .edge-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 1rem; }
  .edge-card h5 { font-size: 0.85rem; margin-bottom: 0.25rem; color: var(--accent); }
  .edge-card p { font-size: 0.82rem; margin: 0; color: var(--text-muted); }
  .role-matrix { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.5rem 0; }
  .role-tag { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
  .role-tag.sa { background: #fef3c7; color: #92400e; }
  .role-tag.ops { background: #dbeafe; color: #065f46; }
  .role-tag.les { background: #dcfce7; color: #166534; }
  .role-tag.fin { background: #fce7f3; color: #9d174d; }
  .role-tag.cs  { background: #f3e8ff; color: #6b21a8; }
  .role-tag.te  { background: #e0f2fe; color: #075985; }
  .role-tag.pa  { background: #fff1f0; color: #b91c1c; }
  .role-tag.st  { background: #f0fdf4; color: #166534; }
  .role-tag.hr  { background: #fdf4ff; color: #86198f; }
  @media (max-width: 900px) { nav.toc { display: none; } main { margin-left: 0; padding: 1.5rem; } .edge-grid { grid-template-columns: 1fr; } }
  .anchor { scroll-margin-top: 1rem; }
  .meta-row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
  .meta-row span strong { color: var(--text); }
  .btt { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--primary); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15); opacity: 0.7; transition: opacity 0.15s; z-index: 200; }
  .btt:hover { opacity: 1; }
  .feature-header { background: linear-gradient(135deg, var(--primary), #065f46); color: #fff; padding: 1.25rem 1.5rem; border-radius: 10px; margin: 1.5rem 0 1rem; }
  .feature-header h3 { margin: 0; color: #fff; font-size: 1.2rem; }
  .feature-header p { margin: 0.25rem 0 0; color: rgba(255,255,255,0.85); font-size: 0.85rem; }
  .feature-header .roles { margin-top: 0.5rem; }
</style>
</head>

const b64ToBuf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function unlock() {
  const pwd = document.getElementById('pwd-input').value.trim();
  const btn = document.getElementById('unlock-btn');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('btn-spinner');
  const error = document.getElementById('lock-error');

  if (!pwd) { error.textContent = 'Please enter a password.'; error.classList.add('show'); return; }

  btn.disabled = true;
  btnText.textContent = 'Decrypting...';
  spinner.classList.add('show');
  error.classList.remove('show');

  try {
    if (!window.crypto || !crypto.subtle) {
      error.textContent = 'This browser blocks crypto on file://. Run: npx serve . then open http://localhost:3000/paytrack-prd.html';
      error.classList.add('show');
      btn.disabled = false;
      btnText.textContent = 'Unlock Document';
      spinner.classList.remove('show');
      return;
    }
    const salt = b64ToBuf(PAYLOAD.s);
    const iv = b64ToBuf(PAYLOAD.iv);
    const ct = b64ToBuf(PAYLOAD.ct);
    const enc = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(decrypted);

    document.getElementById('lock-screen').classList.add('unlocked');
    const app = document.getElementById('app');
    app.innerHTML = html;
    app.classList.add('show');
  } catch (e) {
    console.error(e);
    error.textContent = 'Incorrect password. Please try again.';
    error.classList.add('show');
    btn.disabled = false;
    btnText.textContent = 'Unlock Document';
    spinner.classList.remove('show');
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}
document.addEventListener('DOMContentLoaded', () => document.getElementById('pwd-input').focus());
